   <g id="text_11">
    <text style="font-size: 9px; font-family: 'Times New Roman', 'DejaVu Serif', 'SimSun', 'SimHei', 'Microsoft YaHei'; text-anchor: middle" x="154.510866" y="220.513675" transform="rotate(-0 154.510866 220.513675)">核对极点、增益与量纲</text>
