   <g id="text_4">
    <text style="font-size: 7px; font-family: 'Times New Roman', 'DejaVu Serif', 'SimSun', 'SimHei', 'Microsoft YaHei'; text-anchor: middle" x="367.109291" y="96.712526" transform="rotate(-0 367.109291 96.712526)">处理后回到「拟合 ARX」</text>
   </g>
   <g id="text_5">
    <text style="font-size: 7px; font-family: 'Times New Roman', 'DejaVu Serif', 'SimSun', 'SimHei', 'Microsoft YaHei'; text-anchor: middle" x="367.109291" y="208.708374" transform="rotate(-0 367.109291 208.708374)">三级门槛依次为：数据链路、模型结构、激励充分性</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9px; font-family: 'Times New Roman', 'DejaVu Serif', 'SimSun', 'SimHei', 'Microsoft YaHei'; text-anchor: middle" x="154.510866" y="27.792926" transform="rotate(-0 154.510866 27.792926)">采集输入与输出数据</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8px; font-family: 'Times New Roman', 'DejaVu Serif', 'SimSun', 'SimHei', 'Microsoft YaHei'; text-anchor: middle" x="154.510866" y="67.180153" transform="rotate(-0 154.510866 67.180153)">时间戳与量纲一致？</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9px; font-family: 'Times New Roman', 'DejaVu Serif', 'SimSun', 'SimHei', 'Microsoft YaHei'; text-anchor: middle" x="154.510866" y="104.310781" transform="rotate(-0 154.510866 104.310781)">按阶次与延迟拟合 ARX</text>
