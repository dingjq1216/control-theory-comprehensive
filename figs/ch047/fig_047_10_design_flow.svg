    <text style="font-size: 9px; font-family: 'Times New Roman', 'DejaVu Serif', 'SimSun', 'SimHei', 'Microsoft YaHei'; text-anchor: middle" x="131.833701" y="49.03519" transform="rotate(-0 131.833701 49.03519)">一 阶跃试验辨识 K、T、tau</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9px; font-family: 'Times New Roman', 'DejaVu Serif', 'SimSun', 'SimHei', 'Microsoft YaHei'; text-anchor: middle" x="131.833701" y="91.554875" transform="rotate(-0 131.833701 91.554875)">二 判断 tau/T 是否值得上预估器</text>
