   <g id="text_3">
    <text style="font-size: 7px; font-family: 'Times New Roman', 'DejaVu Serif', 'SimSun', 'SimHei', 'Microsoft YaHei'; text-anchor: middle; fill: #c0392b" x="49.056732" y="125.412812" transform="rotate(-0 49.056732 125.412812)">分辨率、非线性、偏心</text>
   </g>
   <g id="text_4">
