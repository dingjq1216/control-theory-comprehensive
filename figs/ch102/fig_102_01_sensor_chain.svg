   <g id="text_2">
    <text style="font-size: 7px; font-family: 'Times New Roman', 'DejaVu Serif', 'SimSun', 'SimHei', 'Microsoft YaHei'; text-anchor: middle" x="49.056732" y="90.489977" transform="rotate(-0 49.056732 90.489977)">编码器 / 旋变 / 应变片</text>
