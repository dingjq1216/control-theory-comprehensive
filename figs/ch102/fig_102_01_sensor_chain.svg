   <g id="text_10">
    <text style="font-size: 9px; font-family: 'Times New Roman', 'DejaVu Serif', 'SimSun', 'SimHei', 'Microsoft YaHei'; text-anchor: middle" x="329.155157" y="70.034245" transform="rotate(-0 329.155157 70.034245)">数字滤波</text>
