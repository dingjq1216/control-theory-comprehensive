   </g>
   <g id="text_5">
    <text style="font-size: 7px; font-family: 'Times New Roman', 'DejaVu Serif', 'SimSun', 'SimHei', 'Microsoft YaHei'; text-anchor: middle" x="142.422874" y="90.476305" transform="rotate(-0 142.422874 90.476305)">放大、相敏解调、RDC</text>
