   <g id="text_6">
    <text style="font-size: 7px; font-family: 'Times New Roman', 'DejaVu Serif', 'SimSun', 'SimHei', 'Microsoft YaHei'; text-anchor: middle; fill: #c0392b" x="142.422874" y="125.412812" transform="rotate(-0 142.422874 125.412812)">噪声、带宽、温漂</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9px; font-family: 'Times New Roman', 'DejaVu Serif', 'SimSun', 'SimHei', 'Microsoft YaHei'; text-anchor: middle" x="235.789016" y="70.034245" transform="rotate(-0 235.789016 70.034245)">采样与量化</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7px; font-family: 'Times New Roman', 'DejaVu Serif', 'SimSun', 'SimHei', 'Microsoft YaHei'; text-anchor: middle" x="235.789016" y="90.476305" transform="rotate(-0 235.789016 90.476305)">ADC、位置锁存</text>
   </g>
   <g id="text_9">
    <text style="font-size: 7px; font-family: 'Times New Roman', 'DejaVu Serif', 'SimSun', 'SimHei', 'Microsoft YaHei'; text-anchor: middle; fill: #c0392b" x="235.789016" y="125.412812" transform="rotate(-0 235.789016 125.412812)">量化、零阶保持</text>
